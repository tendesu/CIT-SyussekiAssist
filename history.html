<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>履歴 | CIT出席アシスト</title>
        <link rel="manifest" href="manifest.json" />
        <meta name="theme-color" content="#30386C" />

        <style>
            body {
                font-family: sans-serif;
                margin: 0;
                background: #f0f0f0;
                color: #000;
            }

            header {
                position: sticky;
                top: 0;
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 10px 12px;
                background: #f0f0f0;
            }

            h1 {
                font-size: 22px;
                margin: 0;
                color: #30386c;
            }

            .back {
                display: flex;
                padding: 8px;
                color: #30386c;
            }

            .icon {
                width: 24px;
                height: 24px;
                fill: none;
                stroke: currentColor;
                stroke-width: 2;
                stroke-linecap: round;
                stroke-linejoin: round;
                flex: 0 0 auto;
            }

            main {
                max-width: 560px;
                margin: 0 auto;
                padding: 0 16px 40px;
            }

            .settings {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
                margin: 8px 0 20px;
            }

            label {
                display: flex;
                align-items: center;
                gap: 8px;
                font-size: 15px;
            }

            select {
                font-size: 15px;
                padding: 6px 8px;
                border: 2px solid #30386c;
                border-radius: 8px;
                background: #fff;
                color: #000;
            }

            button {
                font-size: 15px;
                padding: 8px 14px;
                border-radius: 8px;
                cursor: pointer;
                background: transparent;
                color: #c0392b;
                border: 2px solid #c0392b;
            }

            .note {
                font-size: 13px;
                color: #666;
                margin: -8px 0 20px;
            }

            .card {
                display: flex;
                align-items: center;
                gap: 16px;
                padding: 14px 16px;
                margin-bottom: 12px;
                background: #fff;
                border-radius: 12px;
                box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
            }

            .room {
                min-width: 72px;
                font-size: 32px;
                font-weight: 700;
                text-align: center;
                color: #30386c;
            }

            .detail {
                flex: 1;
                min-width: 0;
            }

            .slot {
                font-size: 16px;
                font-weight: 700;
            }

            .window {
                margin-top: 2px;
                font-size: 13px;
            }

            .dates {
                margin-top: 4px;
                font-size: 13px;
                color: #666;
            }

            .delete {
                padding: 8px;
                line-height: 0;
                border: none;
            }

            .empty {
                margin-top: 60px;
                text-align: center;
                color: #666;
            }

            @media (prefers-color-scheme: dark) {
                body,
                header {
                    background: #121212;
                    color: #fff;
                }
                h1,
                .back {
                    color: #9aa2e0;
                }
                select {
                    background: #1e1e1e;
                    color: #fff;
                    border-color: #9aa2e0;
                }
                .card {
                    background: #1e1e1e;
                }
                .room {
                    color: #9aa2e0;
                }
                .note,
                .dates,
                .empty {
                    color: #aaa;
                }
                button {
                    color: #ff7b6e;
                    border-color: #ff7b6e;
                }
            }
        </style>
    </head>

    <body>
        <header>
            <a class="back" href="./" aria-label="戻る">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M15 18l-6-6 6-6" />
                </svg>
            </a>
            <h1>出席履歴</h1>
        </header>

        <main>
            <div class="settings">
                <label>
                    保存期間
                    <select id="days">
                        <!-- 期限ちょうどに出席時刻を迎えても消えないよう、内部では+1日 -->
                        <option value="8">1週間</option>
                        <option value="15">2週間</option>
                        <option value="22">3週間</option>
                        <option value="29">4週間</option>
                        <option value="36">5週間</option>
                    </select>
                </label>
                <button id="clearAll">すべて削除</button>
            </div>
            <p class="note">
                同じ曜日の授業開始30分前から1時間後まで、トップページに出席ボタンが表示されます。開始時刻は出席の記録が増えるほど絞り込まれます。
            </p>
            <div id="list"></div>
        </main>

        <script src="history-core.js"></script>
        <script>
            const WEEK = ["日", "月", "火", "水", "木", "金", "土"];
            const daysSelect = document.getElementById("days");
            const listEl = document.getElementById("list");

            const hhmm = (min) => `${Math.floor(min / 60)}:${String(min % 60).padStart(2, "0")}`;

            function formatDate(time) {
                const d = new Date(time);
                return `${d.getMonth() + 1}/${d.getDate()}(${WEEK[d.getDay()]}) ${hhmm(d.getHours() * 60 + d.getMinutes())}`;
            }

            // 「火曜日 9:00開始」/ 絞り込み中は「火曜日 9:00か10:00開始」
            function startLabel(c) {
                const starts = c.starts.map((h) => `${h}:00`).join("か");
                return `${WEEK[c.day]}曜日 ${starts}開始`;
            }

            function windowLabel(c) {
                const from = Math.min(...c.starts) * 60 - BEFORE;
                const to = Math.max(...c.starts) * 60 + AFTER;
                return `トップに表示: ${hhmm(from)}〜${hhmm(to)}`;
            }

            // 曜日・時間順 (月曜始まり)
            function sortedClasses(list) {
                return classify(list).sort(
                    (a, b) =>
                        ((a.day + 6) % 7) - ((b.day + 6) % 7) ||
                        Math.min(...a.starts) - Math.min(...b.starts) ||
                        a.room.localeCompare(b.room),
                );
            }

            function render() {
                const list = loadHistory();
                listEl.replaceChildren();
                if (list.length === 0) {
                    listEl.innerHTML = '<p class="empty">履歴はまだありません</p>';
                    return;
                }
                for (const c of sortedClasses(list)) {
                    const card = document.createElement("div");
                    card.className = "card";
                    card.innerHTML = `
                        <div class="room"></div>
                        <div class="detail">
                            <div class="slot"></div>
                            <div class="window"></div>
                            <div class="dates"></div>
                        </div>
                        <button class="delete" aria-label="この授業の履歴を削除">
                            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3" />
                            </svg>
                        </button>`;
                    card.querySelector(".room").textContent = c.room;
                    card.querySelector(".slot").textContent = startLabel(c);
                    card.querySelector(".window").textContent = windowLabel(c);
                    const times = c.items.map((x) => x.time).sort((a, b) => b - a);
                    card.querySelector(".dates").textContent = "出席: " + times.map(formatDate).join("、");
                    card.querySelector(".delete").addEventListener("click", () => {
                        if (!confirm(`${c.room}（${startLabel(c)}）の履歴を削除しますか？`)) return;
                        saveHistory(loadHistory().filter((h) => !(h.room === c.room && times.includes(h.time))));
                        render();
                    });
                    listEl.appendChild(card);
                }
            }

            daysSelect.value = String(getDays());
            daysSelect.addEventListener("change", () => {
                const days = Number(daysSelect.value);
                // 同じ授業の新しい履歴が残るものは数えず、丸ごと消える授業だけ確認する
                const removed = classify(loadHistory()).filter((c) =>
                    c.items.every((x) => Date.now() - x.time >= days * DAY),
                ).length;
                if (removed > 0 && !confirm(`${removed}件の授業が履歴から削除されます。変更しますか？`)) {
                    daysSelect.value = String(getDays());
                    return;
                }
                setDays(days);
                render();
            });

            document.getElementById("clearAll").addEventListener("click", () => {
                if (loadHistory().length === 0) return;
                if (!confirm("すべての履歴を削除しますか？")) return;
                saveHistory([]);
                render();
            });

            render();
        </script>
    </body>
</html>
