<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>履歴 | CIT出席アシスト</title>
        <link rel="manifest" href="manifest.json" />
        <meta name="theme-color" content="#30386C" />

        <style>
            :root {
                --row: 46px;
            }

            body {
                font-family: sans-serif;
                margin: 0;
                background: #f0f0f0;
                color: #000;
            }

            header {
                position: sticky;
                top: 0;
                z-index: 3;
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 10px 12px;
                background: #f0f0f0;
            }

            h1 {
                font-size: 22px;
                margin: 0;
                color: #30386c;
            }

            .back {
                display: flex;
                padding: 8px;
                color: #30386c;
            }

            .icon {
                width: 24px;
                height: 24px;
                fill: none;
                stroke: currentColor;
                stroke-width: 2;
                stroke-linecap: round;
                stroke-linejoin: round;
                flex: 0 0 auto;
            }

            main {
                max-width: 640px;
                margin: 0 auto;
                padding: 0 12px 40px;
            }

            .settings {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
                margin: 8px 0 16px;
            }

            label {
                display: flex;
                align-items: center;
                gap: 8px;
                font-size: 15px;
            }

            select {
                font-size: 15px;
                padding: 6px 8px;
                border: 2px solid #30386c;
                border-radius: 8px;
                background: #fff;
                color: #000;
            }

            button {
                font-size: 15px;
                padding: 8px 14px;
                border-radius: 8px;
                cursor: pointer;
                background: transparent;
                color: #c0392b;
                border: 2px solid #c0392b;
            }

            .note {
                font-size: 13px;
                color: #666;
                margin: 0 0 16px;
            }

            /* 時間割 */
            .timetable {
                display: grid;
                grid-template-columns: 40px repeat(var(--days), minmax(0, 1fr));
                background: #fff;
                border-radius: 12px;
                box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
                overflow: hidden;
            }

            .day-head {
                padding: 8px 0;
                font-size: 14px;
                font-weight: 700;
                text-align: center;
                border-bottom: 1px solid #ddd;
            }

            .day-head.today {
                color: #fff;
                background: #30386c;
            }

            .times {
                position: relative;
            }

            .time {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                height: var(--row);
                box-sizing: border-box;
                font-size: 10px;
                line-height: 1.3;
                color: #666;
                border-top: 1px solid #eee;
            }

            .time b {
                font-size: 13px;
                color: #000;
            }

            .time.now {
                color: #fff;
                background: #30386c;
            }

            .time.now b {
                color: #fff;
            }

            .now-cell {
                position: absolute;
                left: 0;
                right: 0;
                height: var(--row);
                background: rgba(48, 56, 108, 0.12);
            }

            .now-status {
                margin: 0 0 8px;
                font-size: 15px;
                font-weight: 700;
            }

            .day-col {
                position: relative;
                border-left: 1px solid #eee;
                background-image: linear-gradient(#eee 1px, transparent 1px);
                background-size: 100% var(--row);
            }

            .class {
                position: absolute;
                box-sizing: border-box;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                margin: 0;
                padding: 2px;
                font-size: 15px;
                font-weight: 700;
                color: #fff;
                background: #30386c;
                border: 2px solid #30386c;
                border-radius: 6px;
                overflow: hidden;
            }

            /* 開始時刻が2通り考えられる授業 */
            .class.unsure {
                color: #30386c;
                background: rgba(48, 56, 108, 0.1);
                border-style: dashed;
            }

            /* 重なって低くなった授業 */
            .class.compact {
                font-size: 13px;
                line-height: 1;
                border-width: 1px;
            }


            .empty {
                margin: 16px 0 0;
                text-align: center;
                color: #666;
            }

            /* 授業の詳細 */
            .sheet {
                width: min(100% - 32px, 420px);
                padding: 20px;
                border: none;
                border-radius: 16px;
                background: #fff;
                color: #000;
            }

            .sheet::backdrop {
                background: rgba(0, 0, 0, 0.4);
            }

            .sheet-room {
                font-size: 40px;
                font-weight: 700;
                color: #30386c;
            }

            .sheet-slot {
                margin-top: 4px;
                font-size: 17px;
                font-weight: 700;
            }

            .sheet-window {
                margin-top: 4px;
                font-size: 14px;
            }

            .sheet ul {
                margin: 12px 0 0;
                padding-left: 20px;
                font-size: 14px;
                color: #444;
            }

            .sheet-actions {
                display: flex;
                justify-content: space-between;
                gap: 12px;
                margin-top: 20px;
            }

            .sheet-close {
                color: #30386c;
                border-color: #30386c;
            }

            @media (prefers-color-scheme: dark) {
                body,
                header {
                    background: #121212;
                    color: #fff;
                }
                h1,
                .back {
                    color: #9aa2e0;
                }
                select {
                    background: #1e1e1e;
                    color: #fff;
                    border-color: #9aa2e0;
                }
                .timetable,
                .sheet {
                    background: #1e1e1e;
                    color: #fff;
                }
                .day-head {
                    border-color: #333;
                }
                .day-head.today {
                    background: #5a62a8;
                }
                .time {
                    border-color: #2a2a2a;
                }
                .time b {
                    color: #fff;
                }
                .time.now {
                    background: #5a62a8;
                }
                .now-cell {
                    background: rgba(154, 162, 224, 0.16);
                }
                .day-col {
                    border-color: #2a2a2a;
                    background-image: linear-gradient(#2a2a2a 1px, transparent 1px);
                }
                .class {
                    background: #5a62a8;
                    border-color: #5a62a8;
                }
                .class.unsure {
                    color: #c5cbf5;
                    background: rgba(154, 162, 224, 0.12);
                    border-color: #9aa2e0;
                }
                .sheet-room {
                    color: #9aa2e0;
                }
                .note,
                .time,
                .empty,
                .sheet ul {
                    color: #aaa;
                }
                button {
                    color: #ff7b6e;
                    border-color: #ff7b6e;
                }
                .sheet-close {
                    color: #9aa2e0;
                    border-color: #9aa2e0;
                }
            }
        </style>
    </head>

    <body>
        <header>
            <a class="back" href="./" aria-label="戻る">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M15 18l-6-6 6-6" />
                </svg>
            </a>
            <h1>出席履歴</h1>
        </header>

        <main>
            <div class="settings">
                <label>
                    保存期間
                    <select id="days">
                        <!-- 期限ちょうどに出席時刻を迎えても消えないよう、内部では+1日 -->
                        <option value="8">1週間</option>
                        <option value="15">2週間</option>
                        <option value="22">3週間</option>
                        <option value="29">4週間</option>
                        <option value="36">5週間</option>
                    </select>
                </label>
                <button id="clearAll">すべて削除</button>
            </div>
            <p class="note">
                授業開始30分前から1時間後まで、トップページに出席ボタンが表示されます。点線の授業は、出席した時刻から開始時刻が2通り考えられる授業です（両方の時間帯にボタンが表示されます）。
            </p>
            <p class="now-status" id="now"></p>
            <div class="timetable" id="timetable"></div>
            <p class="empty" id="empty" hidden>履歴はまだありません</p>
        </main>

        <dialog class="sheet" id="sheet">
            <div class="sheet-room" id="sheetRoom"></div>
            <div class="sheet-slot" id="sheetSlot"></div>
            <div class="sheet-window" id="sheetWindow"></div>
            <ul id="sheetDates"></ul>
            <div class="sheet-actions">
                <button id="sheetDelete">この授業を削除</button>
                <button class="sheet-close" id="sheetClose">閉じる</button>
            </div>
        </dialog>

        <script src="history-core.js"></script>
        <script>
            const WEEK = ["日", "月", "火", "水", "木", "金", "土"];
            const daysSelect = document.getElementById("days");
            const table = document.getElementById("timetable");
            const sheet = document.getElementById("sheet");
            let current = null;

            const hhmm = (min) => `${Math.floor(min / 60)}:${String(min % 60).padStart(2, "0")}`;

            function formatDate(time) {
                const d = new Date(time);
                return `${d.getMonth() + 1}/${d.getDate()}(${WEEK[d.getDay()]}) ${hhmm(d.getHours() * 60 + d.getMinutes())}`;
            }

            // 9:00開始を1限とする
            const periodOf = (h) => (h >= FIRST_START && h <= LAST_START ? h - FIRST_START + 1 : null);

            // 「火曜日 1限（9:00開始）」/ 2通り考えられる場合は「火曜日 1限か2限（9:00か10:00開始）」
            function startLabel(c) {
                const times = c.starts.map((h) => `${h}:00`).join("か");
                if (!c.starts.every(periodOf)) return `${WEEK[c.day]}曜日 ${times}開始`;
                return `${WEEK[c.day]}曜日 ${c.starts.map((h) => `${periodOf(h)}限`).join("か")}（${times}開始）`;
            }

            function windowLabel(c) {
                const from = Math.min(...c.starts) * 60 - BEFORE;
                const to = Math.max(...c.starts) * 60 + AFTER;
                return `トップに表示: ${hhmm(from)}〜${hhmm(to)}`;
            }

            // 同じ曜日で時間が重なる授業は、重なっている範囲を縦に分けて並べる
            function assignLanes(classes) {
                let lanes = [];
                let cluster = [];
                let clusterEnd = -Infinity;
                const finish = () => {
                    const top = Math.min(...cluster.map((c) => Math.min(...c.starts)));
                    cluster.forEach((c) => {
                        c.lanes = lanes.length;
                        c.clusterTop = top;
                        c.clusterRows = clusterEnd - top;
                    });
                };
                for (const c of classes.sort(
                    (a, b) => Math.min(...a.starts) - Math.min(...b.starts) || a.room.localeCompare(b.room),
                )) {
                    const top = Math.min(...c.starts);
                    const end = Math.max(...c.starts) + 1;
                    // 重なりが途切れたら並べ方の計算をやり直す
                    if (top >= clusterEnd) {
                        if (cluster.length) finish();
                        lanes = [];
                        cluster = [];
                    }
                    let lane = lanes.findIndex((laneEnd) => laneEnd <= top);
                    if (lane === -1) lane = lanes.push(0) - 1;
                    lanes[lane] = end;
                    c.lane = lane;
                    cluster.push(c);
                    clusterEnd = Math.max(clusterEnd, end);
                }
                if (cluster.length) finish();
            }

            function render() {
                const classes = classify(loadHistory());
                // 月〜金 (土曜・日曜は授業があれば追加)
                const days = [1, 2, 3, 4, 5];
                if (classes.some((c) => c.day === 6)) days.push(6);
                if (classes.some((c) => c.day === 0)) days.push(0);
                const starts = classes.flatMap((c) => c.starts);
                const first = Math.min(FIRST_START, ...starts);
                const last = Math.max(LAST_START, ...starts);
                const now = new Date();
                const today = now.getDay();
                const nowHour = periodOf(now.getHours()) ? now.getHours() : null;
                document.getElementById("now").textContent = nowHour
                    ? `今は ${WEEK[today]}曜日 ${periodOf(nowHour)}限（${nowHour}:00〜${nowHour + 1}:00）`
                    : `今は授業時間外です（${WEEK[today]}曜日 ${hhmm(now.getHours() * 60 + now.getMinutes())}）`;

                table.style.setProperty("--days", days.length);
                table.replaceChildren();
                table.appendChild(document.createElement("div"));
                for (const d of days) {
                    const head = document.createElement("div");
                    head.className = "day-head" + (d === today ? " today" : "");
                    head.textContent = WEEK[d];
                    table.appendChild(head);
                }

                const times = document.createElement("div");
                times.className = "times";
                for (let h = first; h <= last; h++) {
                    const t = document.createElement("div");
                    t.className = "time" + (h === nowHour ? " now" : "");
                    const p = periodOf(h);
                    t.innerHTML = p ? "<b></b><span></span>" : "<span></span>";
                    if (p) t.querySelector("b").textContent = `${p}限`;
                    t.querySelector("span").textContent = `${h}:00`;
                    times.appendChild(t);
                }
                table.appendChild(times);

                for (const d of days) {
                    const col = document.createElement("div");
                    col.className = "day-col";
                    if (d === today && nowHour) {
                        const mark = document.createElement("div");
                        mark.className = "now-cell";
                        mark.style.top = `calc(var(--row) * ${nowHour - first})`;
                        col.appendChild(mark);
                    }
                    const dayClasses = classes.filter((c) => c.day === d);
                    assignLanes(dayClasses);
                    for (const c of dayClasses) {
                        let top = Math.min(...c.starts) - first;
                        let rows = c.starts.length;
                        if (c.lanes > 1) {
                            rows = c.clusterRows / c.lanes;
                            top = c.clusterTop - first + rows * c.lane;
                        }
                        const b = document.createElement("button");
                        b.className =
                            "class" + (c.starts.length > 1 ? " unsure" : "") + (rows < 1 ? " compact" : "");
                        b.style.top = `calc(var(--row) * ${top} + 2px)`;
                        b.style.height = `calc(var(--row) * ${rows} - 4px)`;
                        b.style.left = "2px";
                        b.style.right = "2px";
                        b.setAttribute("aria-label", `${c.room} ${startLabel(c)}`);
                        b.textContent = c.room;
                        b.addEventListener("click", () => openSheet(c));
                        col.appendChild(b);
                    }
                    table.appendChild(col);
                }
                document.getElementById("empty").hidden = classes.length > 0;
            }

            function openSheet(c) {
                current = c;
                document.getElementById("sheetRoom").textContent = c.room;
                document.getElementById("sheetSlot").textContent = startLabel(c);
                document.getElementById("sheetWindow").textContent = windowLabel(c);
                const list = document.getElementById("sheetDates");
                list.replaceChildren();
                for (const t of c.items.map((x) => x.time).sort((a, b) => b - a)) {
                    const li = document.createElement("li");
                    li.textContent = "出席: " + formatDate(t);
                    list.appendChild(li);
                }
                sheet.showModal();
            }

            document.getElementById("sheetClose").addEventListener("click", () => sheet.close());
            // 外側タップで閉じる
            sheet.addEventListener("click", (e) => e.target === sheet && sheet.close());
            document.getElementById("sheetDelete").addEventListener("click", () => {
                const c = current;
                if (!confirm(`${c.room}（${startLabel(c)}）の履歴を削除しますか？`)) return;
                const times = c.items.map((x) => x.time);
                saveHistory(loadHistory().filter((h) => !(h.room === c.room && times.includes(h.time))));
                sheet.close();
                render();
            });

            daysSelect.value = String(getDays());
            daysSelect.addEventListener("change", () => {
                const days = Number(daysSelect.value);
                // 同じ授業の新しい履歴が残るものは数えず、丸ごと消える授業だけ確認する
                const removed = classify(loadHistory()).filter((c) =>
                    c.items.every((x) => Date.now() - x.time >= days * DAY),
                ).length;
                if (removed > 0 && !confirm(`${removed}件の授業が履歴から削除されます。変更しますか？`)) {
                    daysSelect.value = String(getDays());
                    return;
                }
                setDays(days);
                render();
            });

            document.getElementById("clearAll").addEventListener("click", () => {
                if (loadHistory().length === 0) return;
                if (!confirm("すべての履歴を削除しますか？")) return;
                saveHistory([]);
                render();
            });

            render();
            // 今の時限の表示を更新
            setInterval(() => !sheet.open && render(), 60 * 1000);
        </script>
    </body>
</html>
