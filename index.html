<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>CIT出席アシスト</title>
        <link rel="manifest" href="manifest.json" />
        <meta name="theme-color" content="#30386C" />
        <!-- 出席ページへの接続を事前に確立 -->
        <link rel="preconnect" href="https://attendance.is.chibatech.ac.jp" />

        <style>
            body {
                font-family: sans-serif;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;
                background: #f0f0f0;
                color: #000;
                overflow: hidden;
            }

            header {
                position: fixed;
                top: 0;
                width: 100%;
                text-align: center;
                padding: 15px 0;
                background: transparent;
            }

            h1 {
                font-size: 26px;
                margin: 0;
                color: #30386c;
            }

            main {
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                flex: 1;
                text-align: center;
            }

            h2 {
                font-size: 20px;
                margin-bottom: 20px;
            }

            input {
                font-size: 28px;
                padding: 12px;
                width: 220px;
                text-align: center;
                border: 2px solid #30386c;
                border-radius: 8px;
            }

            button {
                margin-top: 30px;
                font-size: 24px;
                padding: 15px 40px;
                background-color: #30386c;
                color: #fff;
                border: none;
                border-radius: 8px;
                cursor: pointer;
            }

            button:hover {
                opacity: 0.9;
            }

            .bottom-links {
                position: fixed;
                left: 50%;
                bottom: 52px;
                transform: translateX(-50%);
                width: min(calc(100vw - 24px), 960px);
                display: grid;
                grid-template-columns: repeat(5, minmax(0, 1fr));
                gap: clamp(8px, 2vw, 18px);
                z-index: 2;
            }

            .bottom-link {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 8px;
                min-width: 0;
                padding: 0;
                border: none;
                background: transparent;
                color: #fff;
                text-decoration: none;
                box-sizing: border-box;
            }

            .bottom-link-icon {
                width: 34px;
                height: 34px;
                border-radius: 10px;
                overflow: hidden;
                flex: 0 0 auto;
            }

            .bottom-link-icon img {
                display: block;
                width: 100%;
                height: 100%;
            }

            .bottom-link-label {
                font-size: 12px;
                line-height: 1.2;
                font-weight: 700;
                text-align: center;
                color: #000;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                width: 100%;
            }

            .bottom-link:hover {
                opacity: 0.92;
            }

            @media (max-width: 560px) {
                .bottom-links {
                    width: calc(100vw - 16px);
                    gap: 6px;
                    bottom: 48px;
                }

                .bottom-link {
                    padding: 0;
                }

                .bottom-link-icon {
                    width: 28px;
                    height: 28px;
                }

                .bottom-link-label {
                    font-size: 10px;
                }
            }

            footer {
                position: fixed;
                bottom: 0;
                width: 100%;
                text-align: center;
                font-size: 12px;
                padding: 10px 5px;
                background: transparent;
                color: #ccc;
                line-height: 1.4;
                word-break: keep-all;
            }

            /* メニュー */
            .menu-button {
                position: fixed;
                top: 10px;
                right: 10px;
                z-index: 11;
                margin: 0;
                padding: 8px;
                background: transparent;
                color: #30386c;
                line-height: 0;
            }

            .icon {
                width: 24px;
                height: 24px;
                fill: none;
                stroke: currentColor;
                stroke-width: 2;
                stroke-linecap: round;
                stroke-linejoin: round;
                flex: 0 0 auto;
            }

            .menu-backdrop {
                position: fixed;
                inset: 0;
                z-index: 10;
            }

            .menu {
                position: fixed;
                top: 56px;
                right: 12px;
                z-index: 11;
                min-width: 220px;
                padding: 6px;
                background: #fff;
                border-radius: 12px;
                box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18);
            }

            .menu-backdrop[hidden],
            .menu[hidden] {
                display: none;
            }

            .menu-item {
                display: flex;
                align-items: center;
                gap: 12px;
                width: 100%;
                margin: 0;
                padding: 12px 14px;
                font-size: 16px;
                text-align: left;
                background: transparent;
                color: #000;
                border-radius: 8px;
            }

            .menu-item:hover {
                background: rgba(48, 56, 108, 0.08);
                opacity: 1;
            }

            .menu-item .icon {
                color: #30386c;
            }

            /* QRリーダー */
            .scanner {
                width: 100%;
                height: 100%;
                max-width: none;
                max-height: none;
                margin: 0;
                padding: 0;
                border: none;
                background: #000;
                color: #fff;
            }

            .scanner video {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            .scanner-frame {
                position: absolute;
                top: 50%;
                left: 50%;
                width: min(65vw, 65vh, 300px);
                aspect-ratio: 1;
                transform: translate(-50%, -50%);
                border: 3px solid #fff;
                border-radius: 16px;
                box-shadow: 0 0 0 100vmax rgba(0, 0, 0, 0.45);
            }

            .scanner-status {
                position: absolute;
                left: 0;
                right: 0;
                bottom: 120px;
                padding: 0 16px;
                font-size: 16px;
                text-align: center;
            }

            .scanner-close {
                position: absolute;
                left: 50%;
                bottom: 40px;
                margin: 0;
                transform: translateX(-50%);
                font-size: 18px;
                padding: 12px 36px;
                background: rgba(255, 255, 255, 0.2);
            }

            .scanner-result {
                position: absolute;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 8px;
                background: #f0f0f0;
                color: #000;
            }

            .scanner-result[hidden] {
                display: none;
            }

            .scanner-result-label {
                font-size: 18px;
            }

            .scanner-result-number {
                font-size: 72px;
                font-weight: 700;
                color: #30386c;
            }

            .scanner-result .scanner-close {
                background: transparent;
                color: #30386c;
                border: 2px solid #30386c;
            }

            /* 共有時のお知らせ */
            .toast {
                position: fixed;
                left: 50%;
                bottom: 140px;
                z-index: 12;
                transform: translateX(-50%);
                padding: 10px 18px;
                font-size: 14px;
                background: rgba(0, 0, 0, 0.8);
                color: #fff;
                border-radius: 8px;
            }

            .toast[hidden] {
                display: none;
            }

            /* ダークモード */
            @media (prefers-color-scheme: dark) {
                body {
                    background: #121212;
                    color: #fff;
                }
                .menu-button {
                    color: #fff;
                }
                .menu {
                    background: #1e1e1e;
                }
                .menu-item {
                    color: #fff;
                }
                .menu-item .icon {
                    color: #9aa2e0;
                }
                .menu-item:hover {
                    background: rgba(255, 255, 255, 0.08);
                }
                .scanner-result {
                    background: #121212;
                    color: #fff;
                }
                .scanner-result-number {
                    color: #9aa2e0;
                }
                .scanner-result .scanner-close {
                    color: #fff;
                    border-color: #9aa2e0;
                }
                input {
                    background: #1e1e1e;
                    color: #fff;
                }
                .bottom-link-label {
                    color: #fff;
                }
                /* input {
        border: 2px solid #5a5f9e;
      }
      button {
        background-color: #5a5f9e;
      }
      h1 {
        color: #5a5f9e;
      } */
                footer {
                    color: #222;
                }
            }
        </style>
    </head>

    <body>
        <header>
            <h1>CIT出席アシスト</h1>
        </header>

        <button
            class="menu-button"
            id="menuButton"
            aria-label="メニュー"
            aria-expanded="false"
            aria-controls="menu"
        >
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 6h16M4 12h16M4 18h16" />
            </svg>
        </button>
        <div class="menu-backdrop" id="menuBackdrop" hidden></div>
        <div class="menu" id="menu" hidden>
            <button class="menu-item" id="scanButton">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="3" y="3" width="7" height="7" rx="1" />
                    <rect x="14" y="3" width="7" height="7" rx="1" />
                    <rect x="3" y="14" width="7" height="7" rx="1" />
                    <path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3" />
                </svg>
                教室番号を確認
            </button>
            <button class="menu-item" id="historyButton">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M3 12a9 9 0 1 0 3-6.7L3 8" />
                    <path d="M3 3v5h5M12 7v5l3 3" />
                </svg>
                履歴を確認・削除
            </button>
            <button class="menu-item" id="shareButton">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="18" cy="5" r="3" />
                    <circle cx="6" cy="12" r="3" />
                    <circle cx="18" cy="19" r="3" />
                    <path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4" />
                </svg>
                アプリを共有する
            </button>
        </div>

        <dialog class="scanner" id="scanner">
            <video id="scannerVideo" playsinline muted></video>
            <div class="scanner-frame"></div>
            <p class="scanner-status" id="scannerStatus">
                教室のQRコードを枠内に映してください
            </p>
            <button class="scanner-close" id="scannerClose">閉じる</button>
            <div class="scanner-result" id="scannerResult" hidden>
                <span class="scanner-result-label">教室番号</span>
                <span class="scanner-result-number" id="scannerNumber"></span>
                <button id="scannerRetry">もう一度読み取る</button>
                <button class="scanner-close" id="scannerResultClose">閉じる</button>
            </div>
        </dialog>

        <div class="toast" id="toast" role="status" hidden></div>

        <main>
            <h2>教室を入力</h2>
            <input
                type="text"
                id="numberInput"
                inputmode="numeric"
                pattern="[0-9]*"
                autofocus
            />
            <br />
            <button id="goButton">出席</button>
        </main>

        <nav class="bottom-links" aria-label="よく使うリンク">
            <a
                class="bottom-link"
                href="https://portal.chibatech.ac.jp/uprx/"
                target="_blank"
                rel="noopener noreferrer"
            >
                <span class="bottom-link-icon"
                    ><img src="link/icon/cit_portal.png" alt="" width="34" height="34"
                /></span>
                <span class="bottom-link-label">CITポータル</span>
            </a>
            <a
                class="bottom-link"
                href="https://cit.manaba.jp/ct/home"
                target="_blank"
                rel="noopener noreferrer"
            >
                <span class="bottom-link-icon"
                    ><img src="link/icon/manaba.png" alt="" width="34" height="34"
                /></span>
                <span class="bottom-link-label">manaba</span>
            </a>
            <a
                class="bottom-link"
                href="https://www.cit-s.com/dining/"
                target="_blank"
                rel="noopener noreferrer"
            >
                <span class="bottom-link-icon"
                    ><img src="link/icon/gohan.png" alt="" width="34" height="34"
                /></span>
                <span class="bottom-link-label">学食</span>
            </a>
            <a
                class="bottom-link"
                href="https://kmsk.is.it-chiba.ac.jp/portal/whole/gakubu/bus_schedule.pdf"
                target="_blank"
                rel="noopener noreferrer"
            >
                <span class="bottom-link-icon"
                    ><img src="link/icon/bus.png" alt="" width="34" height="34"
                /></span>
                <span class="bottom-link-label">バスダイヤ</span>
            </a>
            <a
                class="bottom-link"
                href="https://kmsk.is.it-chiba.ac.jp/portal/"
                target="_blank"
                rel="noopener noreferrer"
            >
                <span class="bottom-link-icon"
                    ><img src="link/icon/siryou.png" alt="" width="34" height="34"
                /></span>
                <span class="bottom-link-label">学生資料室</span>
            </a>
        </nav>

        <footer>
            このツールの利用によって生じるいかなる問題について、<wbr />制作者は一切の責任を負いません。
        </footer>

        <script>
            const input = document.getElementById("numberInput");
            const button = document.getElementById("goButton");

            function jump() {
                const value = input.value.trim();
                if (value !== "") {
                    const targetUrl =
                        "https://attendance.is.chibatech.ac.jp/attendance/class_room/" +
                        value;
                    window.location.href = targetUrl;
                }
            }

            // ボタン移動
            button.addEventListener("click", jump);

            // Enter移動
            input.addEventListener("keydown", (e) => {
                if (e.key === "Enter") jump();
            });

            // change移動
            input.addEventListener("change", jump);

            // blur移動 厄介
            // input.addEventListener("blur", jump);

            // オートフォーカス (autofocusが効かない環境向け)
            if (document.activeElement !== input) input.focus();

            // メニュー
            const menuButton = document.getElementById("menuButton");
            const menu = document.getElementById("menu");
            const menuBackdrop = document.getElementById("menuBackdrop");

            function setMenu(open) {
                menu.hidden = !open;
                menuBackdrop.hidden = !open;
                menuButton.setAttribute("aria-expanded", String(open));
            }

            menuButton.addEventListener("click", () => setMenu(menu.hidden));
            menuBackdrop.addEventListener("click", () => setMenu(false));
            document.addEventListener("keydown", (e) => {
                if (e.key === "Escape") setMenu(false);
            });

            // 教室番号を確認 (QRリーダーは押されたときに読み込む)
            let qrLoading;
            document.getElementById("scanButton").addEventListener("click", () => {
                setMenu(false);
                qrLoading ??= new Promise((resolve, reject) => {
                    const s = document.createElement("script");
                    s.src = "qr.js";
                    s.onload = resolve;
                    s.onerror = () => {
                        qrLoading = null;
                        reject();
                    };
                    document.head.appendChild(s);
                });
                qrLoading.then(
                    () => window.openScanner(),
                    () => showToast("QRリーダーを読み込めませんでした"),
                );
            });

            // 履歴 (未実装)
            document.getElementById("historyButton").addEventListener("click", () => {
                setMenu(false);
            });

            // アプリを共有
            const APP_URL = "https://tendesu.github.io/CIT-SyussekiAssist/";
            document.getElementById("shareButton").addEventListener("click", async () => {
                setMenu(false);
                if (navigator.share) {
                    try {
                        await navigator.share({ title: "CIT出席アシスト", url: APP_URL });
                    } catch (e) {
                        // キャンセル時は何もしない
                    }
                    return;
                }
                try {
                    await navigator.clipboard.writeText(APP_URL);
                    showToast("URLをコピーしました");
                } catch (e) {
                    showToast(APP_URL);
                }
            });

            // お知らせ表示
            const toast = document.getElementById("toast");
            let toastTimer;
            function showToast(text) {
                toast.textContent = text;
                toast.hidden = false;
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => (toast.hidden = true), 2500);
            }

            // オフラインキャッシュ
            if ("serviceWorker" in navigator) {
                navigator.serviceWorker.register("sw.js");
            }
        </script>
    </body>
</html>
